name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  behavior:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check state transitions and request boundaries
        run: python -m unittest discover -s tests -v
      - name: Import the documented example
        run: python app.py --empty --data-dir workspaces/ci --import-manifest examples/manifest.json
      - name: Back up, inspect, and restore the example
        run: |
          python workspace_archive.py prepare --data-dir workspaces/ci
          python workspace_archive.py export --data-dir workspaces/ci --output workspaces/ci-backup.zip
          python workspace_archive.py inspect workspaces/ci-backup.zip
          python workspace_archive.py restore workspaces/ci-backup.zip --destination workspaces/ci-restored
      - name: Check frontend syntax
        run: node --check static/app.js
      - name: Check evidence preview and review draft behavior
        run: node --test tests/test_frontend.js
